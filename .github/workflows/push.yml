# Verschickt Push-Nachrichten (Duell: du bist dran · Live-Battle gestartet).
# Läuft alle 5 Minuten (GitHub startet geplante Läufe oft etwas später) und lässt sich manuell starten.
name: Push-Nachrichten
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: push-sender
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - run: node send.mjs
        working-directory: tools/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://sieberjasmin25-pixel.github.io/bwl-battle/
